<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#333"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker>
  </defs>
  <rect width="840" height="620" fill="#ffffff"/>
  <text x="420" y="36" font-size="18" font-weight="bold" fill="#1a2b4a" text-anchor="middle">Closed-Loop Pipeline (Step Functions)</text>

  <!-- edges -->
  <line x1="465" y1="110" x2="465" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="465" y1="210" x2="465" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="165" x2="640" y2="175" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="605" y="160" font-size="10" fill="#b85450" text-anchor="middle">build error</text>
  <line x1="570" y1="290" x2="640" y2="295" stroke="#82b366" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="585" y="284" font-size="11" fill="#3f7a34">pass</text>
  <line x1="465" y1="330" x2="465" y2="390" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="470" y="365" font-size="11" fill="#b85450">fail (Catch)</text>
  <line x1="570" y1="435" x2="640" y2="430" stroke="#d79b00" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="636" y="420" font-size="11" fill="#a9760a" text-anchor="end">yes → escalate</text>
  <line x1="360" y1="435" x2="280" y2="425" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="285" y="458" font-size="11" fill="#333">no → remediate</text>
  <line x1="180" y1="385" x2="180" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="188" y="360" font-size="11" fill="#333">fixed</text>
  <line x1="270" y1="290" x2="360" y2="290" stroke="#9673a6" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="272" y="284" font-size="11" fill="#6a4a7a">loop → re-validate</text>
  <path d="M180,455 L180,545 L715,545 L715,460" fill="none" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ao)"/>
  <text x="360" y="540" font-size="10" fill="#a9760a">no fix / error (Catch) → escalate</text>

  <!-- nodes -->
  <ellipse cx="465" cy="90" rx="45" ry="20" fill="#d5e8d4" stroke="#82b366"/>
  <text x="465" y="95" font-size="12" font-weight="bold" fill="#20401a" text-anchor="middle">START</text>

  <rect x="360" y="140" width="210" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="465" y="166" font-size="12" font-weight="bold" fill="#12305e" text-anchor="middle">Transform</text>
  <text x="465" y="184" font-size="10" fill="#12305e" text-anchor="middle">ATX CLI in CodeBuild</text>
  <text x="465" y="198" font-size="10" fill="#12305e" text-anchor="middle">baseline → transform → package</text>

  <rect x="360" y="260" width="210" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="465" y="286" font-size="12" font-weight="bold" fill="#12305e" text-anchor="middle">Validate</text>
  <text x="465" y="304" font-size="10" fill="#12305e" text-anchor="middle">CodeBuild build + tests</text>
  <text x="465" y="318" font-size="10" fill="#12305e" text-anchor="middle">publishes validation.log</text>

  <polygon points="465,390 575,435 465,480 355,435" fill="#fff2cc" stroke="#d6b656"/>
  <text x="465" y="430" font-size="12" font-weight="bold" fill="#7a5c00" text-anchor="middle">CheckAttempts</text>
  <text x="465" y="447" font-size="10" fill="#7a5c00" text-anchor="middle">attempt ≥ max (3)?</text>

  <rect x="70" y="400" width="200" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="170" y="426" font-size="12" font-weight="bold" fill="#12305e" text-anchor="middle">Remediate</text>
  <text x="170" y="444" font-size="10" fill="#12305e" text-anchor="middle">Bedrock (Claude) AI auto-fix</text>
  <text x="170" y="458" font-size="10" fill="#12305e" text-anchor="middle">overwrite modernized.zip</text>

  <rect x="80" y="255" width="180" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="170" y="281" font-size="12" font-weight="bold" fill="#4a2c5a" text-anchor="middle">NextAttempt</text>
  <text x="170" y="299" font-size="10" fill="#4a2c5a" text-anchor="middle">attempt = attempt + 1</text>
  <text x="170" y="313" font-size="10" fill="#4a2c5a" text-anchor="middle">(States.MathAdd)</text>

  <rect x="640" y="265" width="150" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="715" y="290" font-size="12" font-weight="bold" fill="#20401a" text-anchor="middle">Completed</text>
  <text x="715" y="308" font-size="10" fill="#20401a" text-anchor="middle">download ready</text>

  <rect x="640" y="400" width="150" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="715" y="425" font-size="12" font-weight="bold" fill="#7a4f00" text-anchor="middle">Escalated</text>
  <text x="715" y="443" font-size="10" fill="#7a4f00" text-anchor="middle">human review</text>

  <rect x="640" y="145" width="150" height="60" rx="8" fill="#f8cecc" stroke="#b85450"/>
  <text x="715" y="170" font-size="12" font-weight="bold" fill="#6a2320" text-anchor="middle">Failed</text>
  <text x="715" y="188" font-size="10" fill="#6a2320" text-anchor="middle">transform build error</text>
</svg>
