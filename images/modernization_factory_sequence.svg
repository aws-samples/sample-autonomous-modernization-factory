<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#333"/></marker>
    <marker id="sg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#3f7a34"/></marker>
  </defs>
  <rect width="880" height="720" fill="#ffffff"/>
  <text x="440" y="30" font-size="18" font-weight="bold" fill="#1a2b4a" text-anchor="middle">Browser-side Flow - Upload → Run → Poll → Result</text>

  <!-- lifelines -->
  <line x1="90"  y1="80" x2="90"  y2="690" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="275" y1="80" x2="275" y2="690" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="470" y1="80" x2="470" y2="690" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="620" y1="80" x2="620" y2="690" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="790" y1="80" x2="790" y2="690" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- participant headers -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="30"  y="50" width="120" height="30" rx="6" fill="#dae8fc" stroke="#6c8ebf"/><text x="90"  y="70" fill="#12305e">Browser</text>
    <rect x="210" y="50" width="130" height="30" rx="6" fill="#d5e8d4" stroke="#82b366"/><text x="275" y="70" fill="#20401a">Web App (API)</text>
    <rect x="430" y="50" width="80"  height="30" rx="6" fill="#ffe6cc" stroke="#d79b00"/><text x="470" y="70" fill="#7a4f00">S3</text>
    <rect x="560" y="50" width="120" height="30" rx="6" fill="#ffe6cc" stroke="#d79b00"/><text x="620" y="70" fill="#7a4f00">DynamoDB</text>
    <rect x="725" y="50" width="130" height="30" rx="6" fill="#e1d5e7" stroke="#9673a6"/><text x="790" y="70" fill="#4a2c5a">Step Functions</text>
  </g>

  <g font-size="11" fill="#222">
    <!-- upload -->
    <line x1="90" y1="110" x2="275" y2="110" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="100" y="104">POST /api/uploads (ZIP)</text>
    <line x1="275" y1="138" x2="470" y2="138" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="285" y="132">store uploads/&lt;id&gt;/source.zip</text>
    <line x1="275" y1="166" x2="90" y2="166" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#s)"/>
    <text x="100" y="160" fill="#555">201 { upload_id }</text>

    <!-- start run -->
    <line x1="90" y1="206" x2="275" y2="206" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="100" y="200">POST /api/runs { upload_id, transformation_id, target }</text>
    <line x1="275" y1="234" x2="620" y2="234" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="285" y="228">put run record (QUEUED)</text>
    <line x1="275" y1="262" x2="790" y2="262" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="285" y="256">StartExecution { run_id, transformation, target, attempt:0 }</text>
    <line x1="275" y1="290" x2="90" y2="290" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#s)"/>
    <text x="100" y="284" fill="#555">202 { run_id, TRANSFORMING }</text>

    <!-- note: language gate -->
    <rect x="210" y="300" width="200" height="24" rx="4" fill="#fff2cc" stroke="#d6b656"/>
    <text x="310" y="316" font-size="10" text-anchor="middle" fill="#7a5c00">language gate runs before StartExecution</text>

    <!-- poll loop -->
    <rect x="55" y="345" width="775" height="150" rx="6" fill="none" stroke="#9673a6" stroke-dasharray="6 4"/>
    <rect x="55" y="345" width="150" height="20" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="62" y="360" font-size="10" font-weight="bold" fill="#4a2c5a">loop  every ~3s until terminal</text>

    <line x1="90" y1="392" x2="275" y2="392" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="100" y="386">GET /api/runs/{run_id}</text>
    <line x1="275" y1="420" x2="790" y2="420" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="285" y="414">DescribeExecution + GetExecutionHistory</text>
    <line x1="275" y1="448" x2="470" y2="448" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="285" y="442">read progress.log</text>
    <line x1="275" y1="476" x2="90" y2="476" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#s)"/>
    <text x="100" y="470" fill="#555">status + curated progress timeline</text>

    <!-- on completed -->
    <rect x="30" y="515" width="180" height="24" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="120" y="531" font-size="10" text-anchor="middle" fill="#20401a">when status = COMPLETED</text>

    <line x1="90" y1="565" x2="275" y2="565" stroke="#3f7a34" stroke-width="1.4" marker-end="url(#sg)"/>
    <text x="100" y="559" fill="#20401a">GET /report  ·  GET /download</text>
    <line x1="275" y1="593" x2="470" y2="593" stroke="#333" stroke-width="1.4" marker-end="url(#s)"/>
    <text x="285" y="587">read change_report.json · presign modernized.zip (SigV4)</text>
    <line x1="275" y1="621" x2="90" y2="621" stroke="#777" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#s)"/>
    <text x="100" y="615" fill="#555">unified diff + presigned download URL</text>

    <rect x="30" y="650" width="330" height="40" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="195" y="666" font-size="11" font-weight="bold" text-anchor="middle" fill="#12305e">Browser renders per-file git-style diff viewer</text>
    <text x="195" y="682" font-size="11" text-anchor="middle" fill="#12305e">+ download button</text>
  </g>
</svg>
